name = "cloudflare-private-notes"
main = "worker/index.ts"
compatibility_date = "2026-10-14"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "cloudflare-private-notes"
database_id = "80bc9a9e-af34-4e3e-abc3-9328d0871f95"
migrations_dir = "migrations"

[observability]
enabled = false

[vars]
SESSION_TTL_SECONDS = "604800"
