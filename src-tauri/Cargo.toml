[package]
name = "cloudflare-private-notes"
version = "1.0.0"
description = "End-to-end encrypted private notes"
authors = ["Cloudflare Private Notes contributors"]
edition = "2021"

[lib]
name = "cloudflare_private_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
